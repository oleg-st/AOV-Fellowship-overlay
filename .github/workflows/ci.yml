name: Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deps
        run: npm ci

      - name: Build
        run: |
          npm run dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Fellowship Overlay.exe
          path: |
            release/Fellowship Overlay.exe
